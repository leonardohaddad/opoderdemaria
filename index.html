<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>O Poder de Maria — Em breve</title>
  <meta name="description" content="O Poder de Maria — ebook. Em breve.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f3ec;
      --ink: #1f2a44;
      --muted: #5b6478;
      --accent: #2f5d9e;
      --gold: #b8924a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: radial-gradient(ellipse at top, #ffffff 0%, var(--bg) 60%);
      color: var(--ink);
      font-family: "Inter", system-ui, sans-serif;
      text-align: center;
    }
    main { max-width: 560px; }
    .star { color: var(--gold); font-size: 28px; letter-spacing: 12px; }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 600;
      font-size: clamp(40px, 9vw, 64px);
      line-height: 1.05;
      margin: 20px 0 16px;
      color: var(--accent);
    }
    p { color: var(--muted); font-size: 18px; line-height: 1.6; }
    .badge {
      display: inline-block;
      margin-top: 32px;
      padding: 10px 22px;
      border: 1px solid var(--gold);
      border-radius: 999px;
      color: var(--gold);
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <div class="star">✦ ✦ ✦</div>
    <h1>O Poder de Maria</h1>
    <p>Um novo ebook está chegando. Volte em breve.</p>
    <span class="badge">Em breve</span>
  </main>
</body>
</html>
